*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.55 var(--f-body);padding-inline:16px;padding-block:0 48px}

header.stub{position:relative;margin:20px auto 0;max-width:1180px;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 4px 4px;padding:22px 24px 26px;box-shadow:var(--shadow)}

.stub-meta{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px;color:var(--ink-2)}
.stub-meta b{font-weight:600;color:var(--ink)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:18px}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);margin:18px auto 0;max-width:1180px;padding:8px 0;display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}

main{max-width:1180px;margin:20px auto 0}
section.panel{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}

section.panel>*,.grid2>*,.card,.bug-layout>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px}
.section-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}

.chip i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.o-passed i,.s-covered-passing i{background:var(--good)} .o-passed,.s-covered-passing{color:var(--good-ink)}
.o-failed-known-bug i,.s-covered-failing i{background:var(--serious)} .o-failed-known-bug,.s-covered-failing{color:var(--serious-ink)}
.o-failed-unexplained i{background:var(--critical)} .o-failed-unexplained{color:var(--critical-ink)}
.o-skipped i,.s-designed-not-run i,.o-not-run i{background:var(--neutral)}
.o-flaky i{background:var(--warning)} .o-flaky{color:var(--warning-ink)}
.s-not-covered i{background:var(--critical)} .s-not-covered{color:var(--critical-ink)}
.sev{font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:5px;color:#fff}
.sev-Critical{background:var(--critical)} .sev-High{background:var(--serious);color:#2a1206} .sev-Medium{background:var(--warning);color:#2a1d00} .sev-Low{background:var(--neutral);color:#111}

.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:128px 1fr 56px;gap:12px;align-items:center}
.bar-row .name{font-size:13px;color:var(--ink-2)}
.bar-row .tot{font:500 13px var(--f-mono);text-align:right;color:var(--muted)}
.bar{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden;background:var(--sunken)}
.bar span{display:block;height:100%;min-width:3px;cursor:default}
.bar span:first-child{border-radius:4px 0 0 4px}.bar span:last-child{border-radius:0 4px 4px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:2px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px}

.kpi .l{font-size:12px;color:var(--muted);margin-top:6px}
.meter{height:6px;border-radius:3px;background:var(--sunken);margin-top:10px;overflow:hidden}
.meter b{display:block;height:100%;background:var(--good)}

table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunken);position:sticky;top:0}

.doc{max-width:none;font-size:15px;line-height:1.6}

.doc tr:last-child td{border-bottom:0}

.doc td,.doc th{padding:8px 12px;vertical-align:top}

.doc td code,.doc th code{font-size:12.5px}
.doc pre code{background:none;padding:0}

.timeline{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:step}
.timeline li{display:grid;grid-template-columns:44px 1fr;gap:14px;position:relative;padding-bottom:18px}
.timeline li::before{counter-increment:step;content:counter(step,decimal-leading-zero);font:500 12px/28px var(--f-mono);text-align:center;width:32px;height:28px;border-radius:6px;background:var(--sunken);border:1px solid var(--line);color:var(--ink-2)}
.timeline li::after{content:"";position:absolute;left:16px;top:30px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}

.timeline .art{font:12px var(--f-mono);color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.timeline li>div{min-width:0;overflow-wrap:anywhere}
.drift{display:grid;gap:6px;font-size:13.5px}

es set to 0 and every result records its route (first attempt, retry, not run).","rule":"PRINCIPLES 34 / VERIFICATION 1: a pass must name the mechanism that produced it","artefact":"automation/playwright.config.ts"},{"phase":"Automate","what":"Tests that expose a bug are left red with a bug annotation, never marked expected-to-fail, so a fixed bug turns them green and an unrelated failure cannot hide behind the bug.","rule":"VERIFICATION 1: green-by-expected-failure rubber-stamps","artefact":"automation/tests/support/fixtures.ts"},{"phase":"Automate","what":"Positive preconditions: paging checks assert the list is longer than one page; the label audit asserts more than 8 fields were found.","rule":"VERIFICATION 2: the success state must be distinguishable from the not-yet-started state","artefact":"tests/api/events.spec.ts, tests/e2e/regression"},{"phase":"Run","what":"First API run: 32 failures; 30 mapped to known bugs, 2 unexplained (TC-VIP-05, TC-DISC-10). Investigated: PATCH also allows 5 VIP (BUG-08) and the late-added discount still gets the pre-discount fee (BUG-07). No failure left unexplained.","rule":"VERIFICATION 8: a finding must be allowed to survive","artefact":"reports/api.json"},{"phase":"Run","what":"TC-UI-02 passed although the profile overflows: the check measured the page before the email loaded, and random test emails were short and hyphenated. Fixed the wait and used a realistic email; the check now fails for the right reason (scrollWidth 494).","rule":"VERIFICATION 2 and 3: an empty or not-yet-loaded world passes","artefact":"tests/e2e/regression/regression.spec.ts"},{"phase":"Run","what":"TC-UI-12 was classified 'known bug' while it failed on a test-code error. Lesson: a known-bug label is trusted only after reading the error text; fixed the race and it now fails on the real duplicate.","rule":"VERIFICATION 7: do not fool yourself with the measuring instrument itself","artefact":"src/report/aggregate.ts"},{"phase":"Run","what":"No destructive request was ever sent to shared data: admin edit probed with an empty body, delete with a non-existent id, stock PATCH with its current value; every created order is cancelled once at teardown.","rule":"PRINCIPLES 20 and 38: never touch what is not yours; writes stay inside what is ours","artefact":"tests/api/orders-admin.spec.ts"},{"phase":"Run","what":"The 50% refund tier cannot be executed here; it is a skipped test with the reason, not substituted with another event.","rule":"PRINCIPLES 33: a named thing that is not there is a finding, not an obstacle","artefact":"TC-CAN-04"},{"phase":"Evidence","what":"Each bug reproduced in a real browser with video, screenshot, HAR and a request/response log; cookies, tokens and passwords redacted before writing.","rule":"PRINCIPLES 20: never store credentials; PRINCIPLES 25: the deliverable is the artefact","artefact":"assets/BUG-*"},{"phase":"Trace","what":"RTM generated from requirements, test cases, results and bugs; catalogue drift (cases not automated, ids in code missing from the catalogue, bugs without a test) is computed and shown.","rule":"PRINCIPLES 37: improving a source and refreshing its copies is one act","artefact":"rtm.md, dashboard"},{"phase":"Evidence","what":"The first 10 and 30 minute evidence runs broke at teardown: another Playwright run in parallel wiped the shared test-results folder that held their traces. Continuous recordings of the wait were also 16 MB and 133 MB. Fix: the evidence project got its own output folder, and long waits are recorded as two short clips (before and after) that share one session through storageState. Both bugs had already been confirmed by the slow suite and by screenshots.","rule":"VERIFICATION 7: the instrument is code too, and it fails quietly; PRINCIPLES 36: state the cost before buying another round","artefact":"automation/playwright.config.ts, tests/evidence/timing.evidence.spec.ts"},{"phase":"Run","what":"Stability: npm run test:stability runs smoke, API and regression three times in a row, each under its own run id, and compares every test outcome; no test changed outcome between runs (latest counts on the dashboard).","rule":"PRINCIPLES 6: three consistent runs before a pull request","artefact":"automation/scripts/stability.mjs, automation/reports/stability/"},{"phase":"Explore","what":"Chased the IDOR pattern one step further: PATCH on another customer's cart line. It holds (404), so it became a passing check (TC-ORD-05) rather than a bug.","rule":"VERIFICATION 8: a finding must be allowed to survive, and so must a negative result","artefact":"tests/api/orders-admin.spec.ts"},{"phase":"Report","what":"I moved every run output to YYYYMMDDTHHmmssSSS names (reports, coverage, Playwright output, evidence, logs); filtered runs go to \u003csuite>-partial. Earlier fixed-name outputs were migrated using their file time or recordedAt, so no history was lost.","rule":"PRINCIPLES 27: restate a correction and write it down with its reason; VERIFICATION 7","artefact":"automation/src/report/runId.ts"},{"phase":"Review","what":"I reviewed the whole submission from five angles: SDET, QA manager, fullstack developer, solution architect and DevOps. About 60 findings; the changes below are what came out of it.","rule":"PRINCIPLES 16: several reviewer perspectives catch what one misses","artefact":"this log, README.md"},{"phase":"Review","what":"Developer view: the frontend bundle is source for the UI. Ten feature flags in it (f01, f03, f04, f24, f30 to f35) each switch a UI defect on. Four of those defects I had missed, plus two more I found checking the rest: BUG-32 to BUG-37 (pager past the last page, stale success message, stale total, clipped cart lines, Cancel on cancelled orders, phone menu hidden behind the page). All six reproduced live and got tests and evidence.","rule":"VERIFICATION 9: look at the real system; PRINCIPLES 32","artefact":"spec/bugs.json BUG-32..37"},{"phase":"Review","what":"SDET view: TC-UI-07 passed for the wrong reason (the unsorted list already opened with the expected title), so it now waits for the sorted response and compares the whole page; it now fails on BUG-23 as it should. The BUG-21 evidence could report 'reproduced' from a list still loading; it now decides from the API. Conditional assertions (TC-CAN-03, TC-DISC-10) were made explicit or turned into a stated skip.","rule":"VERIFICATION 2 and 3: a check that cannot fail, or passes on an empty world, measures nothing","artefact":"tests/e2e/regression, tests/evidence"},{"phase":"Review","what":"SDET view: any failure of a bug-tagged test used to count as 'known bug', so a timeout could hide behind an old bug. Now only an assertion failure counts, and a bug-tagged test that passes while its bug is open is flagged. Proved by sabotage: forcing every failure to count as an assertion turned the new unit test red.","rule":"VERIFICATION 1 and PRINCIPLES 35","artefact":"src/report/aggregate.ts"},{"phase":"Review","what":"QA manager view: BUG-11's text described a 3-ticket run while its recording showed 1 ticket; the steps are now written from the recorded run on a dedicated quiet event. Expected results in the discount test cases were formulas; they are now numbers. Added three boundary cases, raised BUG-03 to Critical (same flaw as BUG-02), and rewrote causes as hypotheses.","rule":"PRINCIPLES 5: done is a verified state; the evidence must match the claim","artefact":"bugs.md, test-cases.md"},{"phase":"Review","what":"Architect view: event ids were hard-coded. A global setup now chooses the events by rule from the live list at the start of each run and writes the choice to reports/world/\u003crun id>.json. Spec files are schema-checked and cross-referenced by a unit test and by the dashboard build, which now fails on any drift. Evidence is written to a '.incomplete' folder and renamed only when complete. Config lives in one module.","rule":"PRINCIPLES 32 and 37; LESSONS: the same setting in two stores","artefact":"src/data/world.ts, src/spec/catalogue.ts, src/config.ts"},{"phase":"Review","what":"DevOps view: the stability script could never fail, and no CI gate existed because the API and regression suites are red by design. Added scripts/gate.mjs, which fails only on unexplained failures, flaky tests, missing reports, or bug-tagged tests that pass. The first gate run caught two real problems (TC-VIP-04 exposed a new route to BUG-08; TC-ADM-03 exposed validation before authorisation, noted as OBS-05). Also: Node pinned to 22.18 or later, portable npm scripts, a CI template inside the submission folder, and clean and prune scripts.","rule":"PRINCIPLES 7: gates are mechanised and fail closed","artefact":"automation/scripts, automation/ci/github-actions.yml"},{"phase":"Iteration 3","what":"I wrote the plan for the open items as an SDD first, re-checking every premise against the code. One premise was partly refuted: the API stock-delta tests already run serially in one file; only the evidence suite had a real overlap (BUG-36 and BUG-11 on the quiet event).","rule":"PRINCIPLES 12: premises are checked the same day they are acted on","artefact":"test-plan.md §13"},{"phase":"Iteration 3","what":"Five reviewers read the SDD before any code. The QA-manager view changed the priorities most: a severity pass came first, and three plumbing items were cut down. OI-7 (reusing a cart from an earlier run) was dropped: it would store working logins, always skip in CI, and skip exactly when BUG-12 is fixed.","rule":"PRINCIPLES 16: plan review before implementation, several perspectives","artefact":"test-plan.md §13"},{"phase":"Iteration 3","what":"Each new mechanism was broken on purpose once: a misspelt id fails tsc; a corrupted dashboard payload fails the build; an evidence test touching the quiet event fails the isolation test; unmerged shard blobs fail the gate. The 124-title codemod was proved by an identical --list output before and after, and the 2-shard API run merged to 94 tests with no outcome different from the full run.","rule":"PRINCIPLES 35: prove that a check can fail","artefact":"tests/unit, scripts/merge-shards.mjs"},{"phase":"Iteration 3","what":"The DevOps review caught that the locally installed Firefox and WebKit builds did not match Playwright 1.63; I installed the matching ones before the first cross-engine run. Smoke passed on both; the three phone bugs reproduced on WebKit's iPhone profile too, which backs findings that rested on Chromium emulation alone.","rule":"PRINCIPLES 10: environment first","artefact":"src/projects.ts, reports/mobile-webkit"},{"phase":"Report","what":"I kept every shared artefact in English for the reviewers, and my own working notes in Vietnamese.","rule":"PRINCIPLES 23: audience decides the language","artefact":"all files"}],"docs":{"overview":"\u003ch1>Event Booking: system description\u003c/h1>\n\u003cp>Written from three sources, in this order of authority: the business brief (\u003ccode>round-1-brief.md\u003c/code>), the live\nsystem (API at \u003ccode>/docs/json\u003c/code>, the web app, probed on 2026-09-24), and the frontend bundle. Where the\nsystem and the brief disagree, the brief decides and the disagreement is a bug. Where the brief is\nsilent, the gap is listed at the end, never filled by guessing.\u003c/p>\n\u003ch2>1. What the product is\u003c/h2>\n\u003cp>A ticketing site for cultural and sporting events in Vietnam. There is no seat map: a buyer picks a\n\u003cstrong>ticket type\u003c/strong> (Standard, VIP, Student) and a \u003cstrong>quantity\u003c/strong>. Every event offers all three types.\nPrices are in Vietnamese dong (₫), whole numbers.\u003c/p>\n\u003cdiv class=\"doc-table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Actor\u003c/th>\n\u003cth>Can do\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Visitor\u003c/td>\n\u003ctd>Browse, search, filter and sort the event list; open an event\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Customer\u003c/td>\n\u003ctd>Everything a visitor can, plus register, log in, keep a cart, apply a discount code, check out, see and cancel own orders, edit phone and password\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Administrator\u003c/td>\n\u003ctd>Create, edit, delete events; adjust stock; see and export all orders filtered by status and date; delete orders\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. Architecture as observed\u003c/h2>\n\u003cdiv class=\"doc-table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Layer\u003c/th>\n\u003cth>Observed\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Frontend\u003c/td>\n\u003ctd>React single-page app (Vite build, one bundle \u003ccode>/assets/index-*.js\u003c/code>), every element carries a \u003ccode>data-testid\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Backend\u003c/td>\n\u003ctd>Fastify (error code \u003ccode>FST_ERR_VALIDATION\u003c/code>), JSON API under \u003ccode>/api\u003c/code>, OpenAPI 3.0.3 document at \u003ccode>/docs/json\u003c/code>, Swagger UI at \u003ccode>/docs\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Session\u003c/td>\n\u003ctd>JWT in an \u003ccode>HttpOnly; Secure; SameSite=Strict\u003c/code> cookie named \u003ccode>token\u003c/code>; payload \u003ccode>sub, email, role, iat, exp\u003c/code> with \u003ccode>exp - iat = 1800 s\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Data\u003c/td>\n\u003ctd>Sequential integer ids for events, ticket types, cart items and orders\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Timestamps\u003c/td>\n\u003ctd>Stored and returned in UTC (\u003ccode>2026-10-04T17:30:00.000Z\u003c/code>); the UI must show Vietnam time (UTC+7)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Config\u003c/td>\n\u003ctd>\u003ccode>/api/config\u003c/code> returns 40 enabled feature flags (\u003ccode>f01\u003c/code> to \u003ccode>f65\u003c/code>). Ten appear in the frontend bundle, each switching one UI defect on (see BUG-25, 27, 28, 30, 32 to 37); the rest presumably act on the server\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Screens (routes)\u003c/h3>\n\u003cdiv class=\"doc-table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Route\u003c/th>\n\u003cth>Purpose\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>/\u003c/code> or \u003ccode>/events\u003c/code>\u003c/td>\n\u003ctd>Event list: search box, venue filter, sort (by date, by name), 10 per page, Previous / Next\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/events/:id\u003c/code>\u003c/td>\n\u003ctd>Event detail: venue, start, three ticket cards with price, remaining, quantity and Add\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/login\u003c/code>\u003c/td>\n\u003ctd>Login and Register tabs (email, password, optional phone)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/cart\u003c/code>\u003c/td>\n\u003ctd>Cart lines, quantity, Remove, discount code, hold expiry, order summary (subtotal, discount, service fee, total)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/checkout\u003c/code>\u003c/td>\n\u003ctd>Recipient name, phone, student card number when a Student ticket is in the cart, Pay\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/orders/:id/confirm\u003c/code>\u003c/td>\n\u003ctd>Order confirmation\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/my-orders\u003c/code>\u003c/td>\n\u003ctd>Own orders with status, total, refund and Cancel tickets\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/profile\u003c/code>\u003c/td>\n\u003ctd>Phone number, change password\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/admin/events\u003c/code>, \u003ccode>/admin/orders\u003c/code>\u003c/td>\n\u003ctd>Administration screens\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>API (27 documented operations)\u003c/h3>\n\u003cdiv class=\"doc-table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Area\u003c/th>\n\u003cth>Operations\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Meta\u003c/td>\n\u003ctd>\u003ccode>GET /api/health\u003c/code>, \u003ccode>GET /api/config\u003c/code>, \u003ccode>GET /robots.txt\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Auth\u003c/td>\n\u003ctd>\u003ccode>POST /api/auth/register\u003c/code>, \u003ccode>POST /api/auth/login\u003c/code>, \u003ccode>POST /api/auth/logout\u003c/code>, \u003ccode>GET /api/auth/me\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Events\u003c/td>\n\u003ctd>\u003ccode>GET /api/events?q&amp;venue&amp;sort&amp;page&amp;pageSize\u003c/code>, \u003ccode>GET /api/events/{id}\u003c/code>, \u003ccode>POST /api/events\u003c/code>, \u003ccode>PUT /api/events/{id}\u003c/code>, \u003ccode>DELETE /api/events/{id}\u003c/code>, \u003ccode>PATCH /api/ticket-types/{id}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cart\u003c/td>\n\u003ctd>\u003ccode>GET /api/cart\u003c/code>, \u003ccode>POST /api/cart/items\u003c/code>, \u003ccode>PATCH /api/cart/items/{id}\u003c/code>, \u003ccode>POST /api/cart/discount\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Orders\u003c/td>\n\u003ctd>\u003ccode>POST /api/orders\u003c/code>, \u003ccode>GET /api/orders\u003c/code>, \u003ccode>GET /api/orders/{id}\u003c/code>, \u003ccode>POST /api/orders/{id}/cancel\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Profile\u003c/td>\n\u003ctd>\u003ccode>GET /api/profile\u003c/code>, \u003ccode>PATCH /api/profile\u003c/code>, \u003ccode>POST /api/profile/password\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Admin\u003c/td>\n\u003ctd>\u003ccode>GET /api/admin/orders?status&amp;from&amp;to\u003c/code>, \u003ccode>GET /api/admin/orders.csv\u003c/code>, \u003ccode>DELETE /api/admin/orders/{id}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>3. Domain model\u003c/h2>\n\u003cpre>\u003ccode>User(id, email, role CUSTOMER|ADMIN, phone?)\nEvent(id, slug, title, venue, startsAt UTC, status UPCOMING|PAST)\n  └─ TicketType(id, name STANDARD|VIP|STUDENT, price, remaining)\nCart(user) ── CartItem(id, ticketTypeId, quantity, unitPrice) ; discountCode ; holdExpiresAt\n  totals: gross, discount, serviceFee, total\nOrder(id, status CONFIRMED|CANCELLED, recipientName, phone, studentCardNo?, discountCode?,\n      grossAmount, discountAmount, serviceFeeAmount, totalAmount, refundAmount, createdAt)\n  └─ OrderItem(ticketTypeId, ticketTypeName, eventTitle, unitPrice, quantity)\n\u003c/code>\u003c/pre>\n\u003ch2>4. Business rules (the specification)\u003c/h2>\n\u003cp>Each rule has an id used by the test cases, the RTM and the bug list (\u003ccode>spec/requirements.json\u003c/code>).\u003c/p>\n\u003ch3>Accounts\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>REQ-ACC-01\u003c/strong> Email must be well formed. \u003cstrong>REQ-ACC-02\u003c/strong> Password at least 8 characters.\u003c/li>\n\u003cli>\u003cstrong>REQ-ACC-03\u003c/strong> Phone, if given, 10 to 15 digits. \u003cstrong>REQ-ACC-04\u003c/strong> One email, one account.\u003c/li>\n\u003cli>\u003cstrong>REQ-ACC-05\u003c/strong> Login returns a cookie session. \u003cstrong>REQ-ACC-06\u003c/strong> Session expires after 30 minutes.\u003c/li>\n\u003cli>\u003cstrong>REQ-ACC-07\u003c/strong> Profile can change phone and password. \u003cstrong>REQ-ACC-08\u003c/strong> New password must differ from the current one.\u003c/li>\n\u003cli>Forgotten passwords are reset by an administrator; the system sends no mail.\u003c/li>\n\u003c/ul>\n\u003ch3>Booking\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>REQ-BOOK-01\u003c/strong> Each add is a whole number of at least 1.\u003c/li>\n\u003cli>\u003cstrong>REQ-BOOK-02\u003c/strong> At most 4 VIP tickets per order.\u003c/li>\n\u003cli>\u003cstrong>REQ-BOOK-03\u003c/strong> Cart holds tickets 10 minutes from the most recent add; after that it must be refreshed before checkout.\u003c/li>\n\u003cli>\u003cstrong>REQ-BOOK-04\u003c/strong> Recipient name at most 50 characters. \u003cstrong>REQ-BOOK-05\u003c/strong> Phone at least 10 digits.\u003c/li>\n\u003cli>\u003cstrong>REQ-BOOK-06\u003c/strong> Student tickets need a student card number (any value, not validated).\u003c/li>\n\u003cli>\u003cstrong>REQ-BOOK-07\u003c/strong> Past events stay listed with a Past label and cannot be booked.\u003c/li>\n\u003c/ul>\n\u003ch3>Pricing (order of operations)\u003c/h3>\n\u003cpre>\u003ccode>subtotal      = Σ unitPrice × quantity\ndiscount      = code % × (Standard lines only)          REQ-DISC-01, applied once REQ-DISC-02\nafter         = subtotal − discount\nservice fee   = 5% × after                              REQ-PRICE-01\ntotal         = after + service fee                     fee on its own line: REQ-PRICE-02\n\u003c/code>\u003c/pre>\n\u003cp>Worked example: 2 Standard at ₫100,000 with WELCOME10 gives subtotal 200,000, discount 20,000,\nfee 9,000, total \u003cstrong>189,000\u003c/strong>.\u003c/p>\n\u003ch3>Refunds\u003c/h3>\n\u003cdiv class=\"doc-table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Cancelled\u003c/th>\n\u003cth>Refund\u003c/th>\n\u003cth>Id\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>More than 24 h before start\u003c/td>\n\u003ctd>100%\u003c/td>\n\u003ctd>REQ-REF-01\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Within 24 h of start\u003c/td>\n\u003ctd>50%\u003c/td>\n\u003ctd>REQ-REF-02\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>After start\u003c/td>\n\u003ctd>0%\u003c/td>\n\u003ctd>REQ-REF-03\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Search and sorting\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>REQ-SRCH-01\u003c/strong> Search matches any part of the name, ignoring case (\u003ccode>rock\u003c/code> finds \u003cem>Hanoi Rock Fest\u003c/em>).\u003c/li>\n\u003cli>\u003cstrong>REQ-SRCH-02\u003c/strong> Venue filter is an exact match.\u003c/li>\n\u003cli>\u003cstrong>REQ-SRCH-03/04\u003c/strong> Sort by name (alphabetical) or date (ascending) over the whole list; page 1 opens with the first of the full sorted list.\u003c/li>\n\u003cli>\u003cstrong>REQ-SRCH-05\u003c/strong> 10 per page; every event exactly once across pages.\u003c/li>\n\u003c/ul>\n\u003ch3>Time zone, screens, administration\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>REQ-TZ-01\u003c/strong> Every time shown is Vietnam time (UTC+7).\u003c/li>\n\u003cli>\u003cstrong>REQ-UI-01\u003c/strong> Fully usable at 360 px, purchase included, without zoom or sideways scroll.\u003c/li>\n\u003cli>\u003cstrong>REQ-UI-02\u003c/strong> Every field has a visible label; clicking it focuses the field.\u003c/li>\n\u003cli>\u003cstrong>REQ-UI-03\u003c/strong> Messages describe the most recent action.\u003c/li>\n\u003cli>\u003cstrong>REQ-ADM-01\u003c/strong> Admin operations are never available to a customer, by any route.\u003c/li>\n\u003cli>\u003cstrong>REQ-SEC-01\u003c/strong> (implied) A customer reads and cancels only their own orders.\u003c/li>\n\u003cli>\u003cstrong>REQ-INV-01\u003c/strong> (implied) A cancel returns stock once; a cancelled order cannot be cancelled again.\u003c/li>\n\u003c/ul>\n\u003ch3>Intentional behaviour (not defects)\u003c/h3>\n\u003col>\n\u003cli>The 5% fee makes the total higher than quantity × price, shown on its own line.\u003c/li>\n\u003cli>The student card number is required but not validated.\u003c/li>\n\u003cli>Past events stay in the list with a Past label.\u003c/li>\n\u003c/ol>\n\u003ch2>5. Test data found on the live system\u003c/h2>\n\u003cdiv class=\"doc-table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Item\u003c/th>\n\u003cth>Value\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Events\u003c/td>\n\u003ctd>23; one PAST (\u003cem>Autumn Symphony Night\u003c/em>, 15 Aug 2026); next start \u003cem>Mid-Autumn Lantern Night\u003c/em> 2026-10-04T17:30Z\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ticket prices\u003c/td>\n\u003ctd>e.g. event 7: Standard 100,000, Student 50,000, VIP 300,000\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Discount code\u003c/td>\n\u003ctd>\u003ccode>WELCOME10\u003c/code> (10%), found by probing; the brief names no codes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Accounts\u003c/td>\n\u003ctd>Three published customer accounts; this work registers its own per test run\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>6. Specification gaps (questions for the product owner)\u003c/h2>\n\u003cdiv class=\"doc-table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Id\u003c/th>\n\u003cth>Question\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>GAP-01\u003c/td>\n\u003ctd>Which discount codes exist, and their values?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GAP-02\u003c/td>\n\u003ctd>Exactly 24 h before start: 100% or 50%? (read here as 50%)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GAP-03\u003c/td>\n\u003ctd>Is the service fee refunded? (system refunds it)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GAP-04\u003c/td>\n\u003ctd>VIP cap per event or per order? (read as per order)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GAP-05\u003c/td>\n\u003ctd>Can a cart hold more than the remaining stock?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GAP-06\u003c/td>\n\u003ctd>Does a password change end other sessions?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GAP-07\u003c/td>\n\u003ctd>Is a whitespace-only recipient valid? (read as invalid)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GAP-08\u003c/td>\n\u003ctd>The 50% tier cannot be exercised: no event starts within 24 h and only an admin can create one\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GAP-09\u003c/td>\n\u003ctd>&quot;Discount codes apply to Standard tickets&quot;: only to Standard? (read here as only)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>7. How the testing is built (test architecture)\u003c/h2>\n\u003cpre>\u003ccode>spec/requirements.json ─┐   (34 REQ ids, quoted from the brief, + spec gaps)\nspec/test-cases.json ───┼─► checked by src/spec/catalogue.ts (schema + cross-references), in unit tests and in the build\nspec/bugs.json ─────────┘\n        │\n        ▼\nautomation/src/spec      oracle: pricing, refunds, validators, listing, Vietnam time  ◄── unit tests (Vitest, 80% gate)\nautomation/src/config.ts one place for BASE_URL, time zones, workers (CI refuses to start without BASE_URL)\nautomation/src/projects.ts the one list of test projects (suite × engine); config, gate, runner and dashboard read it\nautomation/src/data      world.ts chooses events by rule at run start; factory.ts registers fresh buyers\nautomation/src/api       typed client for all 27 operations; Node fetch or in-page fetch (evidence)\n        │\n        ▼\ntests/api · tests/e2e/smoke · tests/e2e/regression · tests/slow · tests/evidence   (Playwright, retries 0)\n        │  titles use tc(&#39;TC-…&#39;, …) and bug(&#39;BUG-…&#39;), typed by the generated tests/support/ids.ts\n        │  projects: smoke, api, regression (Chromium) + smoke-firefox, smoke-webkit, mobile-webkit (iPhone 13)\n        │  every run under its own id: reports/&lt;project&gt;/&lt;YYYYMMDDTHHmmssSSS&gt;.json, reports/world/&lt;id&gt;.json\n        │  sharded (SHARD=i/n, shared RUN_ID): per-shard blobs, merged by scripts/merge-shards.mjs\n        ▼\nsrc/report/aggregate.ts  outcome per test: passed / failed-known-bug (assertion + bug tag) / failed-unexplained / flaky / skipped\n        │\n        ├─► scripts/gate.mjs        CI verdict (fails on unexplained, flaky, missing report, bug-tagged pass)\n        ├─► scripts/stability.mjs   three runs, any changed outcome fails\n        └─► dashboard/build.mjs     bugs.md, test-cases.md, rtm.md, dashboard/index.html (fails on spec problems or drift)\n\u003c/code>\u003c/pre>\n\u003cp>Design choices, each with its reason:\u003c/p>\n\u003cdiv class=\"doc-table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Choice\u003c/th>\n\u003cth>Reason\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Expected values come only from the oracle\u003c/td>\n\u003ctd>A check that compares the system with itself can never fail\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tests that expose a bug stay red, tagged with the bug id\u003c/td>\n\u003ctd>A fixed bug turns the test green on its own; nothing hides behind &quot;expected to fail&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Only an assertion failure counts as &quot;known bug&quot;\u003c/td>\n\u003ctd>A timeout or crash in a bug-tagged test is a new problem, not the old bug\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Events chosen by rule at run start, saved per run\u003c/td>\n\u003ctd>No hard-coded ids; a reseeded or different environment still works, and the run records what it used\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Stock-delta checks on a &quot;quiet&quot; event\u003c/td>\n\u003ctd>Parallel tests and other candidates must not blur a delta\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Evidence written to \u003ccode>.incomplete\u003c/code>, renamed when complete\u003c/td>\n\u003ctd>An aborted recording can never pass for the latest evidence\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Run ids instead of fixed file names\u003c/td>\n\u003ctd>No run overwrites another; filtered runs go to \u003ccode>&lt;suite&gt;-partial\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>One project list (\u003ccode>src/projects.ts\u003c/code>)\u003c/td>\n\u003ctd>A new engine or suite is added once; the gate and dashboard pick it up without edits\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Test-case and bug ids are TypeScript unions generated from the catalogue\u003c/td>\n\u003ctd>A misspelt id in a test does not compile; a unit test fails if the generated file is stale\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The quiet event is used only by stock-delta checks, and in a parallel-mode file only by the one that measures\u003c/td>\n\u003ctd>Enforced by a unit test over the source (\u003ccode>tests/unit/isolation.test.ts\u003c/code>), not by convention\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Stored artefacts: throwaway emails yes, session tokens and cookies never\u003c/td>\n\u003ctd>Tokens and cookies are redacted from every HAR and log; the only password in the code is the public default of disposable accounts\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Old reports and evidence are moved to ignored archives, not deleted\u003c/td>\n\u003ctd>The repository keeps the newest runs; nothing produced is lost locally (\u003ccode>reports:prune\u003c/code>, \u003ccode>evidence:prune\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n","plan":"\u003ch1>Test plan and strategy\u003c/h1>\n\u003cdiv class=\"doc-table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Product\u003c/td>\n\u003ctd>Event Booking (candidate-01 environment)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Author\u003c/td>\n\u003ctd>tunt01102\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Version\u003c/td>\n\u003ctd>1.2, 2026-09-24 (iteration 3: open items closed through a reviewed design)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Method\u003c/td>\n\u003ctd>Spec-driven: brief → requirement ids → test cases → automated checks → bugs, all traced in the RTM\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>1. Objective\u003c/h2>\n\u003cp>Find the defects that matter most to buyers and to the business, and leave behind a repeatable suite\nthat says, per business rule, whether the live system obeys the brief. &quot;Done&quot; means every requirement\nin \u003ccode>spec/requirements.json\u003c/code> has an explicit state in the RTM (passing, failing with a bug, designed but\nnot runnable with a reason, or not covered), and every bug has evidence someone else can replay.\u003c/p>\n\u003ch2>2. Scope\u003c/h2>\n\u003cp>\u003cstrong>In scope:\u003c/strong> every rule in the brief (34 requirement ids), all 27 documented API operations, the\nbuyer screens on desktop and at 360 px, authorisation between customers and towards admin routes, and the\nfrontend bundle as a source of UI behaviour (its feature flags point at UI defects).\u003c/p>\n\u003cp>\u003cstrong>Out of scope, and why:\u003c/strong>\u003c/p>\n\u003cdiv class=\"doc-table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Area\u003c/th>\n\u003cth>Reason\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Administrator flows as an admin\u003c/td>\n\u003ctd>No admin account is provided; only the customer side of admin rules can be tested\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Load and performance\u003c/td>\n\u003ctd>Shared environment used by other candidates; load would harm them\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Destructive admin checks\u003c/td>\n\u003ctd>Only no-op bodies and non-existent ids are sent to admin routes, so a defect can never alter shared data\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Checkout of carts that would drain shared stock\u003c/td>\n\u003ctd>e.g. 100,000 tickets, negative carts; observed in the cart only\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Browsers other than Chromium\u003c/td>\n\u003ctd>Time-boxed; the defects found are server-side or layout-level, not engine quirks\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>3. Approach (SDD loop)\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Specify.\u003c/strong> Read the brief directly (never a paraphrase), turn each rule into a \u003ccode>REQ-*\u003c/code> id with the\nquoted sentence. List what the brief does not say as \u003ccode>GAP-*\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Observe the real system before writing code against it.\u003c/strong> Capture the OpenAPI document, the test\nids in the bundle and live responses; the capture outranks any assumption.\u003c/li>\n\u003cli>\u003cstrong>Encode the rules as an oracle\u003c/strong> (\u003ccode>automation/src/spec\u003c/code>): pricing, refunds, validators, listing,\nVietnam time. The oracle is unit tested and a deliberate sabotage proves the tests can fail.\u003c/li>\n\u003cli>\u003cstrong>Design test cases\u003c/strong> from the requirements with equivalence classes, boundaries (0/1, 4/5 VIP,\n9/10/15/16 digits, 50/51 characters, 24 h), negative and authorisation cases.\u003c/li>\n\u003cli>\u003cstrong>Automate\u003c/strong> each case at the lowest layer that proves the rule: API for business rules, browser\nfor layout, labels, messages and time display.\u003c/li>\n\u003cli>\u003cstrong>Run, classify, investigate.\u003c/strong> A failure is either a known bug (linked id) or unexplained; an\nunexplained failure is investigated until it is a new bug or a test defect, never left.\u003c/li>\n\u003cli>\u003cstrong>Record evidence\u003c/strong> for every bug in a real browser: video, screenshot, HAR and a request/response log.\u003c/li>\n\u003cli>\u003cstrong>Trace.\u003c/strong> Requirement ↔ test case ↔ automated result ↔ bug in the RTM; drift between catalogue and\ncode is reported, not ignored.\u003c/li>\n\u003c/ol>\n\u003ch2>4. Test levels and suites\u003c/h2>\n\u003cdiv class=\"doc-table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Suite\u003c/th>\n\u003cth>Tool\u003c/th>\n\u003cth>Purpose\u003c/th>\n\u003cth>When\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Unit\u003c/td>\n\u003ctd>Vitest + v8 coverage (gate 80%)\u003c/td>\n\u003ctd>The oracle and the test tooling itself are correct\u003c/td>\n\u003ctd>Every change\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>API\u003c/td>\n\u003ctd>Playwright \u003ccode>request\u003c/code> over a typed client\u003c/td>\n\u003ctd>Every business rule and every documented operation\u003c/td>\n\u003ctd>Every run\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Smoke (E2E)\u003c/td>\n\u003ctd>Playwright Chromium\u003c/td>\n\u003ctd>The shortest buyer path works: list, detail, register, login, cart, checkout, my orders\u003c/td>\n\u003ctd>First, before anything else\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Regression (E2E)\u003c/td>\n\u003ctd>Playwright Chromium, desktop + 360 px\u003c/td>\n\u003ctd>Layout, labels, messages, time zone, search/sort/paging in the UI, admin screens\u003c/td>\n\u003ctd>Every run\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Slow\u003c/td>\n\u003ctd>Playwright, real waits\u003c/td>\n\u003ctd>10 min cart hold, 30 min session\u003c/td>\n\u003ctd>Nightly or on demand\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Evidence\u003c/td>\n\u003ctd>Playwright with video, HAR\u003c/td>\n\u003ctd>One reproduction per bug; passes while the bug reproduces\u003c/td>\n\u003ctd>After triage, and before a retest; never in CI\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cross-engine\u003c/td>\n\u003ctd>Playwright Firefox and WebKit\u003c/td>\n\u003ctd>Smoke on Firefox and WebKit; the 360 px phone tests on WebKit&#39;s iPhone 13 profile\u003c/td>\n\u003ctd>Every run (gated)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Gate\u003c/td>\n\u003ctd>\u003ccode>scripts/gate.mjs\u003c/code>\u003c/td>\n\u003ctd>The CI verdict: fails on unexplained or flaky results, a missing report, or a bug-tagged test that passes\u003c/td>\n\u003ctd>After every run\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Stability\u003c/td>\n\u003ctd>\u003ccode>scripts/stability.mjs\u003c/code>\u003c/td>\n\u003ctd>Smoke, API and regression three times; any changed outcome fails\u003c/td>\n\u003ctd>Before a pull request\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>5. Test design techniques\u003c/h2>\n\u003cdiv class=\"doc-table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Technique\u003c/th>\n\u003cth>Where\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Boundary value\u003c/td>\n\u003ctd>quantity 0/1, VIP 4/5 and 5/6, phone 9/10/15/16, recipient 50/51, password 7/8, pageSize 0/1/100/101, refund 24 h\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Equivalence classes\u003c/td>\n\u003ctd>ticket type (Standard vs VIP vs Student) for discounts; valid / malformed email\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Decision table\u003c/td>\n\u003ctd>refund tier by time to start; discount by ticket type\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>State transition\u003c/td>\n\u003ctd>order CONFIRMED → CANCELLED → (cancel again); cart hold active → lapsed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Authorisation matrix\u003c/td>\n\u003ctd>anonymous / customer / other customer × every protected route\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Oracle comparison\u003c/td>\n\u003ctd>every price, fee, total and refund compared with the spec oracle, never with the system itself\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Exploratory charters\u003c/td>\n\u003ctd>pricing abuse, cross-account access, phone layout, time display\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>6. Risk-based priorities\u003c/h2>\n\u003cdiv class=\"doc-table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Risk\u003c/th>\n\u003cth>Impact\u003c/th>\n\u003cth>Likelihood\u003c/th>\n\u003cth>Priority\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Money is computed wrong (discount, fee, refund)\u003c/td>\n\u003ctd>High\u003c/td>\n\u003ctd>High\u003c/td>\n\u003ctd>P1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>One customer acts on another&#39;s data\u003c/td>\n\u003ctd>High\u003c/td>\n\u003ctd>Medium\u003c/td>\n\u003ctd>P1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Admin operations reachable by customers\u003c/td>\n\u003ctd>High\u003c/td>\n\u003ctd>Medium\u003c/td>\n\u003ctd>P1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A phone buyer cannot purchase\u003c/td>\n\u003ctd>High\u003c/td>\n\u003ctd>Medium\u003c/td>\n\u003ctd>P1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Stock integrity (oversell, double cancel)\u003c/td>\n\u003ctd>High\u003c/td>\n\u003ctd>Medium\u003c/td>\n\u003ctd>P1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Search and paging hide events\u003c/td>\n\u003ctd>Medium\u003c/td>\n\u003ctd>High\u003c/td>\n\u003ctd>P2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Times shown in the wrong zone\u003c/td>\n\u003ctd>Medium\u003c/td>\n\u003ctd>Medium\u003c/td>\n\u003ctd>P2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Validation and labels\u003c/td>\n\u003ctd>Low\u003c/td>\n\u003ctd>High\u003c/td>\n\u003ctd>P3\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>7. Environment and data\u003c/h2>\n\u003cul>\n\u003cli>Live site shared with other candidates; results can shift with their traffic. Events are chosen by rule\nat the start of each run (upcoming, a second upcoming, a quiet one, a past one) and the choice is saved in\n\u003ccode>automation/reports/world/&lt;run id&gt;.json\u003c/code>. Stock-delta checks run on the quiet event, which no other test uses.\nEvery test registers its own buyers.\u003c/li>\n\u003cli>Test accounts use addresses such as \u003ccode>qa-&lt;name&gt;-&lt;id&gt;@example.invalid\u003c/code>, like the brief&#39;s published accounts.\n\u003ccode>.invalid\u003c/code> is a top-level domain reserved so that it never resolves (RFC 2606, RFC 6761): the addresses are\nwell-formed, so the site must accept them, yet no mail can ever reach a real person. The suffix does not mark\nthe input as invalid. The malformed-email cases (TC-REG, BUG-17) break the syntax instead: \u003ccode>not-an-email-&lt;id&gt;\u003c/code>,\n\u003ccode>a&lt;id&gt;@b\u003c/code>, \u003ccode>qa-&lt;id&gt;@@example.invalid\u003c/code> (two @ signs), each with a fresh id so an earlier run cannot answer 409.\u003c/li>\n\u003cli>Browser time zone is set to Europe/London so a correct Vietnam-time display has to be converted.\u003c/li>\n\u003cli>Every order a test creates is cancelled once at teardown so shared stock returns.\u003c/li>\n\u003cli>Published accounts are used only for read-only smoke; they are public fixtures, not secrets.\u003c/li>\n\u003cli>Known side effect: TC-CAN-02 and the BUG-11 evidence cancel an order twice, so while BUG-11 exists each\nrun adds 1 to 2 extra Standard tickets to stock (the defect itself does this). Measured on 2026-09-24:\nevent 4 (Da Nang Startup Summit) Standard stands at 228 against 200 at the start, 28 extra, from the early\nruns; since the review these checks use the quiet event (23, New Year Countdown Hanoi), at 604 Standard.\nReported here so nobody mistakes it for other activity.\u003c/li>\n\u003c/ul>\n\u003ch2>8. Entry and exit criteria\u003c/h2>\n\u003cdiv class=\"doc-table\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Entry\u003c/th>\n\u003cth>Exit\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Site and \u003ccode>/api/health\u003c/code> respond; OpenAPI document readable\u003c/td>\n\u003ctd>Every requirement has an RTM state\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Smoke passes (otherwise stop and report)\u003c/td>\n\u003ctd>\u003ccode>npm run gate\u003c/code> passes: 0 unexplained, 0 flaky, no bug-tagged test passing while its bug is open\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Global setup finds a past event and three upcoming events more than 48 h away\u003c/td>\n\u003ctd>\u003ccode>npm run test:stability\u003c/code> passes: no outcome changes across three runs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Oracle unit tests green, coverage ≥ 80%\u003c/td>\n\u003ctd>Every bug has steps, expected, actual, severity and evidence\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>Known gaps are named with the reason\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>9. Severity and priority\u003c/h2>\n\u003cp>Severity is judged by who is harmed and how much: \u003cstrong>Critical\u003c/strong> (money, security or purchase broken for\nmany, no workaround), \u003cstrong>High\u003c/strong> (a stated rule broken with real harm), \u003cstrong>Medium\u003c/strong> (limited harm or easy\nworkaround), \u003cstrong>Low\u003c/strong> (cosmetic or consistency). Each bug names who is harmed.\u003c/p>\n\u003ch2>10. What was not tested, and why it worries me\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>The 50% refund tier\u003c/strong> (REQ-REF-02). No event starts within 24 h and customers cannot create one.\nIt is the tier most likely to hide an off-by-one at exactly 24 h, and it moves real money.\u003c/li>\n\u003cli>\u003cstrong>Checkout of a negative or zero-quantity cart.\u003c/strong> The cart accepts them (BUG-04); I did not check out,\nbecause doing so would change shared stock. If it confirms, a buyer can offset a line with a negative one.\u003c/li>\n\u003cli>\u003cstrong>Concurrency on the last tickets.\u003c/strong> Two buyers checking out the final seat at once could oversell;\ntesting it safely needs an event with tiny stock, which only an admin can set up.\u003c/li>\n\u003cli>\u003cstrong>Admin flows as an admin\u003c/strong>: CSV contents, date filters in Vietnam time vs UTC, delete semantics.\u003c/li>\n\u003cli>\u003cstrong>Server-side feature flags.\u003c/strong> 30 of the 40 enabled flags do not appear in the frontend bundle, so they\npresumably switch server behaviour. I mapped the bugs I found to behaviour, not to those flags; some flags\nmay hide defects on paths I did not exercise (for example admin-only ones).\u003c/li>\n\u003cli>\u003cstrong>Real devices.\u003c/strong> Smoke passes on Firefox and WebKit, and the three phone bugs (BUG-25, BUG-26, BUG-37)\nreproduce on both Chromium&#39;s and WebKit&#39;s phone emulation. BUG-25 and BUG-37 were also confirmed by hand on a\nreal iPhone 15 Pro Max; BUG-26 and Android phones were not checked on a real device. The full regression\nsuite runs on Chromium only.\u003c/li>\n\u003cli>\u003cstrong>A fast check for the cart hold and the session expiry.\u003c/strong> Both need state older than 10 or 30 minutes. A\ncheck reusing a cart from an earlier run was designed and dropped after review: it would store working\nlogins of shared-site accounts, would always skip in CI, and would skip exactly when BUG-12 is fixed. Both\nbugs stay on the slow suite (nightly in the CI template) and their recorded evidence.\u003c/li>\n\u003c/ol>\n\u003ch2>11. Deliverables\u003c/h2>\n\u003cp>\u003ccode>project-overview.md\u003c/code>, this plan, \u003ccode>spec/requirements.json\u003c/code>, \u003ccode>spec/test-cases.json\u003c/code> (+ \u003ccode>test-cases.md\u003c/code>\nfor the discount flow), \u003ccode>spec/bugs.json\u003c/code> (+ \u003ccode>bugs.md\u003c/code>), \u003ccode>rtm.md\u003c/code>, \u003ccode>assets/BUG-*\u003c/code> evidence, the\n\u003ccode>automation/\u003c/code> suites and the QA dashboard.\u003c/p>\n\u003ch2>12. Review and what changed\u003c/h2>\n\u003cp>After the first pass I reviewed the work from five angles (SDET, QA manager, fullstack developer, solution\narchitect, DevOps). The main changes: six more UI bugs found through the bundle&#39;s feature flags (BUG-32 to\nBUG-37); two checks that could pass for the wrong reason fixed; a stricter rule for what counts as a &quot;known\nbug&quot; failure; events chosen at run time instead of hard-coded; schema checks on the spec files; a CI gate and a\nCI template; concrete numbers in every discount test case. The full list, with the rule each change applies,\nis in \u003ccode>spec/process-log.json\u003c/code> and on the dashboard&#39;s Process tab.\u003c/p>\n\u003ch2>13. Iteration 3\u003c/h2>\n\u003cp>The open items from section 12 were specified in a short design, reviewed from five angles before\nany code was written, and revised (draft 2). The review added a severity\npass (BUG-07 raised to High; every Critical and High now carries its reasoning, enforced by the spec check), and\ncut three items down. Built: cross-engine projects, compile-time ids, sharding with a guarded merge, one\ndashboard data copy, quiet-event isolation enforced by a test, and report retention.\u003c/p>\n"}};
const ASSET = location.protocol === 'file:' ? '../' : '';
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const OUTCOMES = [
  ['passed', 'Passed', 'var(--good)'],
  ['failed-known-bug', 'Failed on a known bug', 'var(--serious)'],
  ['failed-unexplained', 'Failed, unexplained', 'var(--critical)'],
  ['flaky', 'Flaky (passed on retry)', 'var(--warning)'],
  ['skipped', 'Skipped with reason', 'var(--neutral)'],
];
const STATES = [
  ['covered-passing', 'Covered, passing', 'var(--good)'],
  ['covered-failing', 'Covered, failing (bug)', 'var(--serious)'],
  ['designed-not-run', 'Designed, not runnable', 'var(--neutral)'],
  ['not-covered', 'Not covered', 'var(--critical)'],
];
const SEVS = [['Critical', 'var(--critical)'], ['High', 'var(--serious)'], ['Medium', 'var(--warning)'], ['Low', 'var(--neutral)']];
// Project names and labels come from src/projects.ts via the build, so new projects appear without edits here.
const SUITE_NAMES = Object.fromEntries(DATA.projects.map((p) => [p.name, p.label]));
const PROJECT_NAMES = DATA.projects.map((p) => p.name);
const fmtTime = (iso) => (iso ? new Date(iso).toLocaleString('en-GB', { timeZone: 'Asia/Ho_Chi_Minh', dateStyle: 'medium', timeStyle: 'short' }) + ' ICT' : '—');
const outcomeChip = (o) => { const x = OUTCOMES.find((a) => a[0] === o) || [o, o]; return `<span class="chip o-${o}"><i></i>${esc(x[1])}</span>`; };
const stateChip = (s) => { const x = STATES.find((a) => a[0] === s) || [s, s]; return `<span class="chip s-${s}"><i></i>${esc(x[1])}</span>`; };
const sevBadge = (s) => `<span class="sev sev-${s}">${s}</span>`;
// Lists of ids wrap between ids, never inside one (TC-REG-09 must not break at its hyphen).
const idList = (ids, sep = ', ') => ids.map((id) => `<span class="nw">${esc(id)}</span>`).join(sep);
const count = (arr, key) => arr.reduce((m, x) => ((m[x[key]] = (m[x[key]] || 0) + 1), m), {});

function stackBar(label, parts, total) {
  const segs = parts.filter((p) => p.n > 0).map((p) => `<span style="flex:${p.n};background:${p.color}" data-tip="${esc(label)} · ${esc(p.label)}: ${p.n} of ${total} (${Math.round((p.n / total) * 100)}%)"></span>`).join('');
  return `<div class="bar-row"><div class="name">${esc(label)}</div><div class="bar" role="img" aria-label="${esc(label)}: ${parts.map((p) => `${p.label} ${p.n}`).join(', ')}">${segs || ''}</div><div class="tot num">${total}</div></div>`;
}
const legend = (items) => `<div class="legend">${items.map(([, l, c]) => `<span><i style="background:${c}"></i>${esc(l)}</span>`).join('')}</div>`;

// ---------- header
(function header() {
  const res = DATA.results, bugs = DATA.bugs, cov = DATA.unit.coverage;
  const by = count(res, 'outcome');
  const unexplained = by['failed-unexplained'] || 0;
  $('#meta').innerHTML = `<span>Target <b>${esc(DATA.envName)} · live site</b></span><span>Built <b>${fmtTime(DATA.generatedAt)}</b></span><span>Author <b>tunt01102</b></span>`;
  const cells = [
    [DATA.requirements.length, 'requirements from the brief'],
    [DATA.testCases.length, 'test cases designed'],
    [res.length, 'automated results, latest runs'],
    [bugs.length, `bugs · ${bugs.filter((b) => b.severity === 'Critical').length} critical`],
    [cov ? cov.lines.toFixed(1) + '%' : '—', 'unit line coverage (gate 80%)'],
    [unexplained, unexplained ? 'unexplained failures: investigate' : 'unexplained failures'],
  ];
  $('#strip').innerHTML = cells.map(([v, l]) => `<div><div class="v">${v}</div><div class="l">${esc(l)}</div></div>`).join('');
})();

// ---------- tabs
const TABS = [
  ['overview', 'Overview', renderOverview],
  ['project', 'Project', () => `<section class="panel"><article class="card doc">${DATA.docs.overview}</article></section>`],
  ['plan', 'Test plan', () => `<section class="panel"><article class="card doc">${DATA.docs.plan}</article></section>`],
  ['cases', 'Test cases', renderCases],
  ['rtm', 'RTM', renderRtm],
  ['automation', 'Automation', renderAutomation],
  ['bugs', 'Bug tracker', renderBugs],
  ['process', 'Process', renderProcess],
];
function select(id) {
  const t = TABS.find((x) => x[0] === id) || TABS[0];
  document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === t[0])));
  $('#main').innerHTML = t[2]();
  const after = { cases: wireCases, rtm: wireRtm, automation: wireAutomation, bugs: wireBugs }[t[0]];
  if (after) after();
  if (location.hash.slice(1) !== t[0] && !location.hash.startsWith('#BUG')) history.replaceState(null, '', '#' + t[0]);
}
$('#tabs').innerHTML = TABS.map(([id, label]) => `<button role="tab" data-tab="${id}" aria-selected="false">${label}</button>`).join('');
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { select(b.dataset.tab); window.scrollTo({ top: 0 }); } });

// ---------- overview
function renderOverview() {
  const res = DATA.results;
  const suites = PROJECT_NAMES;
  const suiteBars = suites.map((s) => {
    const rs = res.filter((r) => r.suite === s);
    if (!rs.length) return `<div class="bar-row"><div class="name">${SUITE_NAMES[s]}</div><div class="muted" style="font-size:13px">not run yet</div><div class="tot">0</div></div>`;
    const c = count(rs, 'outcome');
    return stackBar(SUITE_NAMES[s], OUTCOMES.map(([k, l, col]) => ({ n: c[k] || 0, label: l, color: col })), rs.length);
  }).join('');
  const st = count(DATA.rtm, 'state');
  const rtmBar = stackBar('Requirements', STATES.map(([k, l, col]) => ({ n: st[k] || 0, label: l, color: col })), DATA.rtm.length);
  const areas = [...new Set(DATA.rtm.map((r) => r.area))];
  const areaBars = areas.map((a) => { const rs = DATA.rtm.filter((r) => r.area === a); const c = count(rs, 'state'); return stackBar(a, STATES.map(([k, l, col]) => ({ n: c[k] || 0, label: l, color: col })), rs.length); }).join('');
  const sevC = count(DATA.bugs, 'severity');
  const sevBars = SEVS.map(([s, col]) => `<div class="bar-row"><div class="name">${sevBadge(s)}</div><div class="bar"><span style="flex:${sevC[s] || 0};background:${col}" data-tip="${s}: ${sevC[s] || 0} bugs"></span><span style="flex:${DATA.bugs.length - (sevC[s] || 0)};background:transparent;min-width:0"></span></div><div class="tot num">${sevC[s] || 0}</div></div>`).join('');
  const areaBug = count(DATA.bugs, 'area');
  const cov = DATA.unit.coverage;
  const covTiles = cov ? ['lines', 'statements', 'functions', 'branches'].map((k) => `<div class="kpi"><div class="v">${cov[k].toFixed(1)}%</div><div class="l">${k}</div><div class="meter"><b style="width:${cov[k]}%"></b></div></div>`).join('') : '<p class="muted">Coverage summary missing: run npm run test:unit.</p>';
  const d = DATA.drift;
  const driftRow = (ok, text) => `<div><span class="${ok ? 'ok-mark' : 'bad-mark'}">${ok ? '✓' : '!'}</span><span>${text}</span></div>`;
  const reproduced = DATA.bugs.filter((b) => b.evidence?.reproduced).length;
  return `<section class="panel">
    <div class="grid2">
      <div class="card"><div class="section-head"><h2>Automated results by suite</h2><span class="count">latest run of each suite</span></div>
        <div class="bars">${suiteBars}</div>${legend(OUTCOMES)}
        <p class="muted" style="font-size:13px;margin:12px 0 0">Tests that expose a bug stay red on purpose, labelled with the bug id. Retries are off, so every pass came from the first attempt.</p></div>
      <div class="card"><div class="section-head"><h2>Requirement coverage</h2><span class="count">${DATA.rtm.length} rules from the brief</span></div>
        <div class="bars">${rtmBar}</div><div style="height:14px"></div><div class="bars">${areaBars}</div>${legend(STATES)}</div>
    </div>

// ---------- keep every id (TC-REG-09, BUG-37, REQ-REF-01, GAP-02, OBS-05) on one line wherever it is rendered,
// including tables that filters redraw: text nodes are wrapped as they appear.
const ID_RE = /\b(?:TC|BUG|REQ|GAP|OBS|OI)-[A-Z0-9]+(?:-[0-9]+)?\b/g;
function keepIdsWhole(root) {
